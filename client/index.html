<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Texas Hold'em — Multiplayer</title>
<script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.2/dist/socket.io.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #0a1f10;
  color: #fff;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

/* ── Lobby ─────────────────────────────────────────────────────────────── */
#lobby {
  background: #1a4a2e;
  border-radius: 16px;
  padding: 32px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.6);
  text-align: center;
}
#lobby h1 { font-size: 26px; color: #f0c040; letter-spacing: 2px; margin-bottom: 6px; }
#lobby p { color: rgba(255,255,255,0.5); font-size: 13px; margin-bottom: 24px; }

.field { margin-bottom: 14px; text-align: left; }
.field label { display: block; font-size: 12px; color: rgba(255,255,255,0.5); margin-bottom: 5px; }
.field input {
  width: 100%;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1.5px solid rgba(255,255,255,0.15);
  background: rgba(0,0,0,0.3);
  color: #fff;
  font-size: 14px;
}
.field input:focus { outline: none; border-color: #f0c040; }
.field input::placeholder { color: rgba(255,255,255,0.25); }

.btn {
  padding: 10px 22px;
  border-radius: 8px;
  border: 1.5px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.1);
  color: #fff;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
}
.btn:hover { background: rgba(255,255,255,0.18); }
.btn:active { transform: scale(0.97); }
.btn.gold { background: #f0c040; color: #1a1a1a; border-color: #f0c040; }
.btn.gold:hover { background: #d9ad38; }
.btn.sm { padding: 7px 14px; font-size: 13px; }
.btn.danger { background: rgba(200,50,50,0.4); border-color: rgba(220,80,80,0.5); }
.btn.danger:hover { background: rgba(200,50,50,0.65); }
.btn:disabled { opacity: 0.4; cursor: default; }

.lobby-btns { display: flex; gap: 10px; justify-content: center; margin-top: 4px; }

/* ── Game ──────────────────────────────────────────────────────────────── */
#game { display: none; width: 100%; max-width: 700px; }

.game-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}
.game-title { font-size: 15px; font-weight: 600; letter-spacing: 1px; color: #f0c040; }
.table-id { font-size: 11px; color: rgba(255,255,255,0.4); }

#table-area {
  background: #1a4a2e;
  border-radius: 20px;
  padding: 20px;
  position: relative;
  box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  overflow: hidden;
}
#table-area::before {
  content: '';
  position: absolute;
  inset: 10px;
  border: 2px solid rgba(255,255,255,0.07);
  border-radius: 14px;
  pointer-events: none;
}

.phase-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.phase-label {
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #f0c040;
  font-weight: 600;
}
.status-msg { font-size: 12px; color: rgba(255,255,255,0.55); }

.pot-row { text-align: center; margin-bottom: 12px; }
.pot-small { font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 1px; }
.pot-big { font-size: 26px; font-weight: 600; color: #f0c040; }

/* Community cards */
.community {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 18px;
  min-height: 80px;
  align-items: center;
}

/* Players grid */
.players-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 8px;
  margin-bottom: 14px;
}

.player-seat {
  background: rgba(0,0,0,0.32);
  border: 1.5px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 8px 10px;
  text-align: center;
  transition: border-color 0.2s, box-shadow 0.2s;
  min-height: 110px;
}
.player-seat.me { border-color: rgba(100,200,255,0.35); }
.player-seat.active { border-color: #f0c040; box-shadow: 0 0 0 2px rgba(240,192,64,0.2); }
.player-seat.folded { opacity: 0.38; }
.player-seat.empty { opacity: 0.2; border-style: dashed; }

.seat-name { font-size: 11px; color: rgba(255,255,255,0.5); margin-bottom: 2px; font-weight: 600; }
.seat-chips { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
.seat-bet { font-size: 11px; color: #f0c040; min-height: 15px; }
.seat-cards { display: flex; justify-content: center; gap: 4px; margin-top: 5px; }
.seat-status { font-size: 11px; color: #f87; margin-top: 2px; min-height: 14px; }
.seat-hand { font-size: 11px; color: #9df; margin-top: 2px; }

/* Cards */
.card {
  width: 44px;
  height: 62px;
  border-radius: 5px;
  border: 1px solid #ccc;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  line-height: 1.1;
  background: #fff;
  color: #111;
  box-shadow: 1px 2px 5px rgba(0,0,0,0.35);
  user-select: none;
  font-size: 13px;
}
.card.red { color: #c00; }
.card.back { background: #1a3a6e; border-color: #1a3a6e; color: rgba(255,255,255,0.2); font-size: 22px; }
.card.placeholder { background: rgba(255,255,255,0.05); border: 1.5px dashed rgba(255,255,255,0.15); box-shadow: none; }
.card-suit { font-size: 16px; }

/* Action area */
#action-area {
  background: rgba(0,0,0,0.25);
  border-radius: 10px;
  padding: 12px 14px;
  margin-top: 4px;
}
.action-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 8px; }
.raise-row {
  display: flex; align-items: center; gap: 8px;
  justify-content: center; flex-wrap: wrap;
}
.raise-row label { font-size: 12px; color: rgba(255,255,255,0.55); }
input[type=range] { width: 130px; accent-color: #f0c040; }
.raise-val { font-size: 13px; color: #f0c040; font-weight: 500; min-width: 55px; }
#waiting-msg { text-align: center; font-size: 13px; color: rgba(255,255,255,0.4); padding: 8px 0; }

/* Timer bar */
.timer-bar-wrap { height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-bottom: 8px; }
#timer-bar { height: 100%; width: 100%; background: #f0c040; border-radius: 2px; transition: width 1s linear; }

/* Log */
#log-panel {
  margin-top: 12px;
  background: rgba(0,0,0,0.2);
  border-radius: 8px;
  padding: 8px 12px;
  max-height: 80px;
  overflow-y: auto;
}
.log-line { font-size: 11px; color: rgba(255,255,255,0.45); line-height: 1.7; }

/* Result overlay */
#result-overlay {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.72);
  border-radius: 20px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  z-index: 20;
}
#result-overlay.show { display: flex; }
.result-title { font-size: 28px; font-weight: 600; color: #f0c040; }
.result-sub { font-size: 15px; color: rgba(255,255,255,0.75); }

/* Connection status */
.conn-dot {
  width: 8px; height: 8px; border-radius: 50%;
  display: inline-block; margin-right: 5px;
}
.conn-dot.ok { background: #4caf50; }
.conn-dot.err { background: #f44336; }
</style>
</head>
<body>

<!-- ── Lobby ── -->
<div id="lobby">
  <h1>♠ Hold'em</h1>
  <p>Texas Hold'em — up to 6 players per table</p>
  <div class="field">
    <label>Your name</label>
    <input id="name-input" type="text" placeholder="Enter your name" maxlength="20">
  </div>
  <div class="field">
    <label>Table ID (leave blank for default)</label>
    <input id="table-input" type="text" placeholder="table-1" maxlength="30">
  </div>
  <div class="lobby-btns">
    <button class="btn gold" onclick="joinTable()">Join Table</button>
    <button class="btn" onclick="createTable()">New Table</button>
  </div>
  <p id="lobby-error" style="color:#f87;font-size:12px;margin-top:12px;"></p>
</div>

<!-- ── Game ── -->
<div id="game">
  <div class="game-header">
    <div>
      <div class="game-title">Texas Hold'em</div>
      <div class="table-id" id="table-id-label"></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span id="conn-indicator"><span class="conn-dot ok"></span><span style="font-size:12px;color:rgba(255,255,255,0.4)">Connected</span></span>
      <button class="btn sm" onclick="leaveTable()">Leave</button>
    </div>
  </div>

  <div id="table-area">
    <div class="phase-row">
      <span class="phase-label" id="phase-label">Waiting</span>
      <span class="status-msg" id="status-msg"></span>
    </div>

    <div class="pot-row">
      <div class="pot-small">POT</div>
      <div class="pot-big" id="pot-display">$0</div>
    </div>

    <div class="community" id="community-cards"></div>
    <div class="players-grid" id="players-grid"></div>

    <div id="action-area">
      <div class="timer-bar-wrap"><div id="timer-bar"></div></div>
      <div class="action-row" id="action-row"></div>
      <div class="raise-row" id="raise-row" style="display:none">
        <label>Raise:</label>
        <input type="range" id="raise-slider" min="20" max="1000" step="10" value="100" oninput="updateRaiseDisplay()">
        <span class="raise-val" id="raise-val">$100</span>
        <button class="btn sm gold" onclick="sendRaise()">Raise</button>
      </div>
      <div id="waiting-msg">Waiting for your turn…</div>
    </div>

    <div id="log-panel"></div>

    <div id="result-overlay">
      <div class="result-title" id="result-title"></div>
      <div class="result-sub" id="result-sub"></div>
    </div>
  </div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────

let socket = null;
let myPlayerId = null;
let myTableId = null;
let gameState = null;
let myHole = [];
let timerInterval = null;
let raiseRowVisible = false;

const SERVER_URL = window.location.origin; // same-origin in production

// ── Lobby ─────────────────────────────────────────────────────────────────

function joinTable() {
  const name = document.getElementById('name-input').value.trim();
  const tableId = document.getElementById('table-input').value.trim() || 'table-1';
  if (!name) { showLobbyError('Enter your name'); return; }
  connect(name, tableId);
}

async function createTable() {
  const name = document.getElementById('name-input').value.trim();
  if (!name) { showLobbyError('Enter your name'); return; }
  const res = await fetch('/api/tables', { method: 'POST' });
  const { tableId } = await res.json();
  connect(name, tableId);
}

function showLobbyError(msg) {
  document.getElementById('lobby-error').textContent = msg;
}

// ── Socket connection ─────────────────────────────────────────────────────

function connect(name, tableId) {
  socket = io(SERVER_URL, { transports: ['websocket'] });

  socket.on('connect', () => {
    socket.emit('join_table', { name, tableId });
    setConnStatus(true);
  });

  socket.on('disconnect', () => setConnStatus(false));

  socket.on('error', ({ message }) => {
    if (!myPlayerId) { showLobbyError(message); socket.disconnect(); }
    else showStatus(message);
  });

  socket.on('joined', ({ playerId, tableId: tid, seat, state }) => {
    myPlayerId = playerId;
    myTableId = tid;
    gameState = state;
    myHole = state.myHole || [];
    showGame(tid);
    render();
  });

  socket.on('your_cards', ({ hole }) => {
    myHole = hole;
    render();
  });

  socket.on('hand_started', ({ dealerSeat, pot, phase, players }) => {
    myHole = [];
    if (gameState) {
      gameState.phase = phase;
      gameState.pot = pot;
      gameState.dealerSeat = dealerSeat;
      gameState.players = players;
      gameState.community = [];
    }
    hideResult();
    setPhase('Pre-flop');
    render();
  });

  socket.on('your_cards', ({ hole }) => {
    myHole = hole;
    render();
  });

  socket.on('player_action', ({ seat, action, name, amount, pot, currentBet, players }) => {
    if (gameState) {
      if (pot !== undefined) gameState.pot = pot;
      if (currentBet !== undefined) gameState.currentBet = currentBet;
      if (players) gameState.players = players;
    }
    const label = {
      fold: `${name} folds`,
      check: `${name} checks`,
      call: `${name} calls $${amount}`,
      raise: `${name} raises to $${amount}`,
    }[action] || action;
    addLog(label);
    render();
  });

  socket.on('phase_change', ({ phase, community, pot, players }) => {
    if (gameState) {
      gameState.phase = phase;
      gameState.community = community;
      gameState.pot = pot;
      gameState.players = players;
    }
    setPhase(phase.charAt(0).toUpperCase() + phase.slice(1));
    render();
  });

  socket.on('your_turn', ({ seat, playerId, toCall, currentBet, pot, timeoutMs }) => {
    if (gameState) {
      gameState.actionSeat = seat;
      gameState.currentBet = currentBet;
      gameState.pot = pot;
    }
    render();
    if (playerId === myPlayerId) {
      showActions(toCall, currentBet);
      startTimer(timeoutMs);
    } else {
      hideActions();
      const acting = gameState && gameState.players[seat];
      showStatus(acting ? `${acting.name}'s turn` : 'Waiting...');
    }
  });

  socket.on('player_joined', ({ name, seat }) => {
    addLog(`${name} joined seat ${seat}`);
    socket.emit('get_state');
  });

  socket.on('state', (state) => {
    gameState = state;
    myHole = state.myHole || [];
    render();
  });

  socket.on('hand_over', ({ winners, reason, pot, showdown, players }) => {
    clearTimer();
    if (gameState) { gameState.players = players; gameState.pot = 0; gameState.community = gameState.community; }
    // Reveal cards
    if (showdown) {
      showdown.forEach(s => {
        const p = gameState && gameState.players.find(x => x.id === s.id);
        if (p) { p._hole = s.hole; p._handName = s.handName; }
        if (s.id === myPlayerId) myHole = s.hole;
      });
    }
    render();
    hideActions();
    const winNames = winners.map(w => w.name).join(' & ');
    showResult(`${winNames} wins!`, reason);
    addLog(`--- Hand over: ${winNames} — ${reason} ---`);
    setTimeout(hideResult, 3800);
  });
}

// ── Sending actions ───────────────────────────────────────────────────────

function sendAction(action, amount) {
  socket.emit('player_action', { action, amount });
  hideActions();
  clearTimer();
}
function sendRaise() {
  const amount = parseInt(document.getElementById('raise-slider').value);
  sendAction('raise', amount);
}
function updateRaiseDisplay() {
  document.getElementById('raise-val').textContent = '$' + document.getElementById('raise-slider').value;
}
function toggleRaiseRow(toCall, currentBet, myChips) {
  raiseRowVisible = !raiseRowVisible;
  const row = document.getElementById('raise-row');
  row.style.display = raiseRowVisible ? 'flex' : 'none';
  if (raiseRowVisible) {
    const min = toCall + 20;
    const max = myChips;
    const slider = document.getElementById('raise-slider');
    slider.min = min; slider.max = max; slider.value = Math.min(min + 40, max);
    updateRaiseDisplay();
  }
}

// ── UI helpers ────────────────────────────────────────────────────────────

function showGame(tableId) {
  document.getElementById('lobby').style.display = 'none';
  document.getElementById('game').style.display = 'block';
  document.getElementById('table-id-label').textContent = `Table: ${tableId}`;
}

function leaveTable() {
  if (socket) socket.disconnect();
  location.reload();
}

function setConnStatus(ok) {
  const el = document.getElementById('conn-indicator');
  el.innerHTML = `<span class="conn-dot ${ok ? 'ok' : 'err'}"></span><span style="font-size:12px;color:rgba(255,255,255,0.4)">${ok ? 'Connected' : 'Reconnecting…'}</span>`;
}

function setPhase(ph) { document.getElementById('phase-label').textContent = ph; }
function showStatus(msg) { document.getElementById('status-msg').textContent = msg; }

function addLog(line) {
  const panel = document.getElementById('log-panel');
  const el = document.createElement('div');
  el.className = 'log-line';
  el.textContent = line;
  panel.appendChild(el);
  panel.scrollTop = panel.scrollHeight;
}

function showActions(toCall, currentBet) {
  const actionRow = document.getElementById('action-row');
  const waitMsg = document.getElementById('waiting-msg');
  const raiseRow = document.getElementById('raise-row');
  raiseRowVisible = false;
  raiseRow.style.display = 'none';
  waitMsg.style.display = 'none';
  actionRow.style.display = 'flex';

  const me = gameState && gameState.players.find(p => p.id === myPlayerId);
  const myChips = me ? me.chips : 0;
  const actualCall = Math.min(toCall, myChips);

  let html = '';
  if (toCall === 0) {
    html += `<button class="btn" onclick="sendAction('check')">Check</button>`;
  } else {
    html += `<button class="btn danger" onclick="sendAction('fold')">Fold</button>`;
    html += `<button class="btn" onclick="sendAction('call',${actualCall})">Call $${actualCall}</button>`;
  }
  if (myChips > toCall) {
    html += `<button class="btn gold" onclick="toggleRaiseRow(${toCall},${currentBet},${myChips})">Raise ▲</button>`;
  }
  actionRow.innerHTML = html;
  showStatus('Your turn!');
}

function hideActions() {
  document.getElementById('action-row').style.display = 'none';
  document.getElementById('raise-row').style.display = 'none';
  document.getElementById('waiting-msg').style.display = 'block';
  raiseRowVisible = false;
}

function showResult(title, sub) {
  const o = document.getElementById('result-overlay');
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-sub').textContent = sub;
  o.classList.add('show');
}
function hideResult() {
  document.getElementById('result-overlay').classList.remove('show');
}

function startTimer(ms) {
  clearTimer();
  const bar = document.getElementById('timer-bar');
  bar.style.transition = 'none';
  bar.style.width = '100%';
  setTimeout(() => {
    bar.style.transition = `width ${ms}ms linear`;
    bar.style.width = '0%';
  }, 50);
}
function clearTimer() {
  const bar = document.getElementById('timer-bar');
  bar.style.transition = 'none';
  bar.style.width = '0%';
}

// ── Render ────────────────────────────────────────────────────────────────

function isRed(s) { return s === '♥' || s === '♦'; }

function cardHTML(c, faceDown) {
  if (!c || faceDown) return `<div class="card back">🂠</div>`;
  return `<div class="card ${isRed(c.suit) ? 'red' : ''}"><span>${c.rank}</span><span class="card-suit">${c.suit}</span></div>`;
}
function emptyCard() { return `<div class="card placeholder"></div>`; }

function render() {
  if (!gameState) return;
  const { phase, pot, community, players, actionSeat, dealerSeat, currentBet, log } = gameState;

  // Pot
  document.getElementById('pot-display').textContent = '$' + pot;

  // Community cards
  const cc = document.getElementById('community-cards');
  let ccHtml = '';
  for (let i = 0; i < 5; i++) ccHtml += i < community.length ? cardHTML(community[i]) : emptyCard();
  cc.innerHTML = ccHtml;

  // Players
  const grid = document.getElementById('players-grid');
  grid.innerHTML = players.map((p, i) => {
    const isMe = p.id === myPlayerId;
    const isActive = i === actionSeat && phase !== 'waiting' && phase !== 'showdown';
    const isDealer = i === dealerSeat;
    let cls = 'player-seat';
    if (isMe) cls += ' me';
    if (isActive) cls += ' active';
    if (p.folded) cls += ' folded';

    // Cards
    let cardsHtml = '';
    if (isMe && myHole.length > 0) {
      cardsHtml = myHole.map(c => cardHTML(c, false)).join('');
    } else if (p._hole) {
      cardsHtml = p._hole.map(c => cardHTML(c, false)).join('');
    } else if (!p.folded && p.cardCount > 0) {
      cardsHtml = Array(p.cardCount).fill(0).map(() => cardHTML(null, true)).join('');
    }

    const handInfo = p._handName ? `<div class="seat-hand">${p._handName}</div>` : '';
    const statusTxt = p.folded ? 'Folded' : p.allIn ? 'All-In' : '';

    return `<div class="${cls}">
      <div class="seat-name">${isDealer ? '🎩 ' : ''}${p.name}${isMe ? ' (you)' : ''}</div>
      <div class="seat-chips">$${p.chips}</div>
      <div class="seat-bet">${p.bet > 0 ? 'Bet: $' + p.bet : ''}</div>
      <div class="seat-cards">${cardsHtml}</div>
      ${handInfo}
      <div class="seat-status">${statusTxt}</div>
    </div>`;
  }).join('');

  // Log
  if (log && log.length) {
    const panel = document.getElementById('log-panel');
    const existing = panel.querySelectorAll('.log-line').length;
    if (existing === 0) {
      log.forEach(l => { const el = document.createElement('div'); el.className = 'log-line'; el.textContent = l; panel.appendChild(el); });
      panel.scrollTop = panel.scrollHeight;
    }
  }
}
</script>
</body>
</html>
